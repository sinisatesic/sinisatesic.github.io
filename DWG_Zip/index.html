<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWG_Zip</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" class="href">
</head>
<body>
    <div class="container">
        <div class="col-12 col-md-6">
            <div id="container">
                <div id="imgTitle">placeholder</div>
                <h1>DWG to ZIP</h1>
                <div id="inputContainer" style="border: 5px solid red;">
                    <input type="file" id="inputBox" accept=".dwg">
                </div>

                <div id="messageContainer"></div>
                <button id="zipFile">Zip DWG File</button>
                </div>
                <script src="dwgConversion.js"></script>
            </div>
        </div>
    </div>
</body>
</html>
